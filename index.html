<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>關西・丹後・城崎 五日行程</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;
  --white:#ffffff;
  --border:#e8e5e0;
  --border2:#d4d0c8;
  --ink:#1a1816;
  --ink2:#4a4744;
  --ink3:#9a9590;
  --gold:#a87820;
  --d1:#3d6b5e;--d2:#2d5470;--d3:#5e3d5a;--d4:#4a5e3a;--d5:#6e4e2a;
}

html,body{min-height:100%;background:var(--bg);font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--ink)}

/* TOP BAR */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:16px 20px 0;position:sticky;top:0;z-index:200}
.topbar-inner{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--ink);line-height:1}
.topbar-title em{font-style:italic;color:var(--gold)}
.topbar-sub{font-size:11px;color:var(--ink3);letter-spacing:.05em;margin-left:2px;padding-bottom:2px}

/* DAY TABS — horizontal scroll */
.day-tabs{display:flex;overflow-x:auto;gap:0;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex-shrink:0;padding:0 18px 12px;cursor:pointer;border-bottom:2px solid transparent;transition:border-color .2s,color .2s;text-align:center;user-select:none;position:relative}
.day-tab:first-child{padding-left:0}
.day-tab .tab-label{font-size:10px;letter-spacing:.18em;color:var(--ink3);margin-bottom:3px;transition:color .2s}
.day-tab .tab-date{font-size:14px;font-weight:500;color:var(--ink2);transition:color .2s}
.day-tab.active .tab-label{color:var(--active-c)}
.day-tab.active .tab-date{color:var(--ink)}
.day-tab.active{border-bottom-color:var(--active-c)}
.day-tab:hover:not(.active) .tab-date{color:var(--ink)}

/* CONTENT AREA */
.content{max-width:520px;margin:0 auto;padding:0 0 60px}

/* DAY PANEL */
.day-panel{display:none;animation:fadeIn .18s ease}
.day-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* MAP SECTION */
.map-section{margin:16px 16px 0;border-radius:12px;overflow:hidden;border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.07);position:relative}
.map-el{width:100%;height:240px;display:block}
.map-footer{padding:8px 12px;background:var(--white);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.map-theme{font-size:11px;color:var(--ink3)}
.map-open-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--gold);text-decoration:none;border:1px solid #d4b060;border-radius:5px;padding:4px 10px;background:#fffbf0;transition:background .15s}
.map-open-btn:hover{background:#fff8e0}

/* STOPS */
.stops-section{padding:8px 16px 0}

.stop-item{display:flex;gap:0;padding:10px 0;position:relative}
.stop-left{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:3px}
.stop-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:white;flex-shrink:0;line-height:1}
.stop-num.stay{box-shadow:0 0 0 2.5px var(--gold)}
.stop-vline{flex:1;width:1.5px;background:var(--border2);margin-top:4px;margin-bottom:0;min-height:8px}
.stop-vline.last{display:none}

.stop-right{flex:1;padding-left:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.stop-item:last-child .stop-right{border-bottom:none;padding-bottom:0}

.stop-header{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.stop-time{font-size:12px;font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums;min-width:38px}
.stop-badge{font-size:9px;padding:1px 6px;border-radius:10px;letter-spacing:.05em;white-space:nowrap}
.badge-stay{background:#fef3d0;color:#8a6010;border:1px solid #e8c070}
.badge-food{background:#fdeee8;color:#8a3020;border:1px solid #e8a090}
.badge-flight{background:#e8f0f8;color:#1a4070;border:1px solid #90b4d8}
.badge-pac{background:#e8f3ee;color:#1a5040;border:1px solid #80c0a0}

.stop-name{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:3px;line-height:1.3}
.stop-desc{font-size:11px;color:var(--ink3);line-height:1.65;margin-bottom:6px}

.drive-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--ink3);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 7px;margin-bottom:6px}

.gmaps-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--ink3);border:1px solid var(--border2);border-radius:4px;padding:3px 8px;text-decoration:none;background:var(--white);transition:background .12s}
.gmaps-link:hover{background:var(--bg);color:var(--ink2)}

/* DAY SUMMARY BAR */
.day-summary{margin:12px 16px 0;padding:10px 14px;background:var(--white);border:1px solid var(--border);border-radius:8px;display:flex;gap:16px;flex-wrap:wrap}
.summary-chip{font-size:11px;color:var(--ink3)}
.summary-chip b{color:var(--ink2);font-weight:500}

/* Leaflet overrides */
.leaflet-control-zoom{border:none!important}
.leaflet-control-zoom a{background:rgba(255,255,255,.9)!important;color:var(--ink)!important;border:1px solid var(--border)!important;width:26px!important;height:26px!important;line-height:26px!important;font-size:14px!important}
.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.7)!important}
.leaflet-popup-content-wrapper{border-radius:8px;font-family:'Noto Sans TC',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.leaflet-popup-content{margin:10px 12px;font-size:12px;line-height:1.5}
.lp-name{font-weight:500;margin-bottom:2px}
.lp-time{color:var(--gold);font-size:11px;margin-bottom:4px}
.lp-link{font-size:10px;color:#1a60a0;text-decoration:none;display:block}

@media(max-width:480px){
  .map-el{height:200px}
  .topbar-sub{display:none}
}
</style>
</head>

const maps = {};
let currentDay = 1;

function init() {
  buildTabs();
  buildPanels();
  selectDay(1);
}

function buildTabs() {
  const el = document.getElementById('dayTabs');
  DAYS.forEach(d => {
    const t = document.createElement('div');
    t.className = 'day-tab';
    t.id = 'tab-' + d.id;
    t.style.setProperty('--active-c', d.color);
    t.innerHTML = `<div class="tab-label">${d.label}</div><div class="tab-date">${d.date}</div>`;
    t.onclick = () => selectDay(d.id);
    el.appendChild(t);
  });
}

function buildPanels() {
  const ct = document.getElementById('content');
  DAYS.forEach(day => {
    const panel = document.createElement('div');
    panel.className = 'day-panel';
    panel.id = 'panel-' + day.id;

    // Map section
    const mapSec = document.createElement('div');
    mapSec.className = 'map-section';
    mapSec.innerHTML = `
      <div class="map-el" id="map-${day.id}"></div>
      <div class="map-footer">
        <span class="map-theme">${day.stops.length} 個定點・約 ${day.km} km</span>
        <a class="map-open-btn" href="${day.gmaps}" target="_blank">📍 Google Maps 完整路線</a>
      </div>`;
    panel.appendChild(mapSec);

    // Stops
    const stopsEl = document.createElement('div');
    stopsEl.className = 'stops-section';
    day.stops.forEach((stop, i) => {
      const isLast = i === day.stops.length - 1;
      const isStay = stop.badge === 'stay';
      const numBg = isStay ? day.color : day.color;

      let badgeHtml = stop.badge
        ? `<span class="stop-badge badge-${stop.badge}">${stop.badgeText}</span>` : '';
      let driveHtml = stop.drive
        ? `<div class="drive-chip">🚗 ${stop.drive}</div>` : '';

      const item = document.createElement('div');
      item.className = 'stop-item';
      item.innerHTML = `
        <div class="stop-left">
          <div class="stop-num${isStay?' stay':''}" style="background:${numBg}">${stop.n}</div>
          <div class="stop-vline${isLast?' last':''}"></div>
        </div>
        <div class="stop-right">
          <div class="stop-header">
            <span class="stop-time">${stop.time}</span>
            ${badgeHtml}
          </div>
          <div class="stop-name">${stop.name}</div>
          ${driveHtml}
          <div class="stop-desc">${stop.desc}</div>
          <a class="gmaps-link" href="${stop.gmaps}" target="_blank">📍 查看地圖</a>
        </div>`;
      stopsEl.appendChild(item);
    });
    panel.appendChild(stopsEl);

    // Summary
    const sum = document.createElement('div');
    sum.className = 'day-summary';
    sum.innerHTML = `<span class="summary-chip">🗓 ${day.date}</span><span class="summary-chip">🚗 <b>${day.km} km</b></span><span class="summary-chip">📍 <b>${day.stops.length}</b> 個定點</span><span class="summary-chip" style="flex:1;text-align:right;font-style:italic">${day.theme}</span>`;
    panel.appendChild(sum);

    ct.appendChild(panel);
  });
}

function selectDay(dayId) {
  currentDay = dayId;
  DAYS.forEach(d => {
    document.getElementById('tab-' + d.id).classList.toggle('active', d.id === dayId);
    document.getElementById('panel-' + d.id).classList.toggle('active', d.id === dayId);
  });
  // Scroll tab into view
  const activeTab = document.getElementById('tab-' + dayId);
  activeTab.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  // Init map
  setTimeout(() => initMap(dayId), 60);
}

function initMap(dayId) {
  if (maps[dayId]) { maps[dayId].invalidateSize(); return; }
  const day = DAYS.find(d => d.id === dayId);
  const m = L.map('map-' + dayId, {
    center: day.center, zoom: day.zoom,
    zoomControl: true,
    scrollWheelZoom: false,
    dragging: true
  });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 18
  }).addTo(m);

  const latlngs = [];
  day.stops.forEach((stop, i) => {
    const ll = [stop.lat, stop.lng];
    latlngs.push(ll);
    const isStay = stop.badge === 'stay';
    const sz = isStay ? 22 : 18;
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${day.color};border:${isStay?'2.5px solid #c9a84c':'2px solid white'};box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;font-family:sans-serif">${stop.n}</div>`,
      iconSize: [sz, sz], iconAnchor: [sz/2, sz/2]
    });
    const marker = L.marker(ll, {icon}).addTo(m);
    marker.bindPopup(`<div class="lp-name">${stop.name}</div><div class="lp-time">${stop.time}${stop.badge ? ' · ' + stop.badgeText : ''}</div><a class="lp-link" href="${stop.gmaps}" target="_blank">📍 在 Google Maps 查看</a>`);
  });

  if (latlngs.length > 1) {
    L.polyline(latlngs, {color: day.color, weight: 3, opacity: 0.75}).addTo(m);
  }
  const grp = L.featureGroup(day.stops.map(s => L.marker([s.lat, s.lng])));
  m.fitBounds(grp.getBounds().pad(0.18));
  maps[dayId] = m;
}

init();
</script>
